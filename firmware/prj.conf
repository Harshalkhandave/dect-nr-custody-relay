CONFIG_NRF_MODEM_LIB=y
CONFIG_MODEM_ANTENNA=n
CONFIG_NRF_MODEM_LINK_BINARY_DECT_PHY=y
CONFIG_HWINFO=y

CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=32768
CONFIG_SF_LOG_LEVEL_INF=y

CONFIG_BOOTLOADER_MCUBOOT=y

CONFIG_SF_SHELL=y
CONFIG_SF_WAIT_FOR_START=y
CONFIG_SF_PERSIST=y
CONFIG_SHELL_STACK_SIZE=3072
CONFIG_SHELL_CMD_BUFF_SIZE=256

CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_PM_PARTITION_SIZE_SETTINGS_STORAGE=0x4000
# Experiments reboot every node before each run. The boot-loop guard would delay the
# radio 2 to 60 s after 5 short runs, and shell settings sent in that window are lost.
# 0 disables the delay (the epoch is still advanced at every boot).
CONFIG_SF_BOOT_DELAY_CAP_S=0

# The log thread otherwise wakes only every 1000 ms, so host time stamps lag the board
# clock by up to a second and a second of lines piles up in the buffer.
CONFIG_LOG_PROCESS_THREAD_SLEEP_MS=50

# The main thread runs sf_port_boot (584-byte frame) and then the settings/NVS flash write, whose
# deepest path (sector rotation and garbage collection) needs about 1.1 KB. With the default 1024
# the stack overflowed on the rotation boot and the board stayed silent.
# 2048 is what Nordic's DECT sample uses.
CONFIG_MAIN_STACK_SIZE=2048
